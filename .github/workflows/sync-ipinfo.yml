name: Weekly GeoIP Lite Release

on:
  schedule:
    - cron: '0 2 * * 1'   # 每周一 UTC 02:00 执行
  workflow_dispatch:       # 允许手动触发

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Download IPinfo Lite Database
        env:
          IPINFO_TOKEN: ${{ secrets.IPINFO_TOKEN }}
        run: |
          mkdir -p ./dist
          curl -fSL -o ./dist/geoip-lite.csv.gz \
            "https://ipinfo.io/data/ipinfo_lite.csv.gz?token=${IPINFO_TOKEN}"
          echo "Downloaded file size: $(du -h ./dist/geoip-lite.csv.gz | cut -f1)"

      - name: Generate Weekly CalVer Tag
        id: version
        run: |
          # %y=两位年, %m=月, %V=ISO周数(周一始)
          # 输出示例: v26.11.45
          TAG="v$(date +'%y.%m.%V')"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "Generated tag: ${TAG}"

      - name: Create Release & Upload Asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: GeoIP Lite ${{ steps.version.outputs.tag }}
          body: |
            📦 Weekly GeoIP Lite database updated on $(date +'%Y-%m-%d')

            **Permanent download link:**
            ```
            https://github.com/ $ {{ github.repository }}/releases/latest/download/geoip-lite.csv.gz

            ```
          files: ./dist/geoip-lite.csv.gz
          make_latest: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
