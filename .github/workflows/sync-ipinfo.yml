name: Sync IPinfo Lite GeoIP CSV

on:
  schedule:
    - cron: '0 3 1 * *'      # 每月 1 号 03:00 UTC 自动跑一次
  workflow_dispatch: {}       # 允许在 Actions 页面手动触发（首次建库/调试用）

# 要回写提交，必须有 contents 写权限
permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download IPinfo Lite (prop-format CSV.gz)
        env:
          # 不把 token 写这里，改用仓库 Secret 注入
          IPINFO_TOKEN: ${{ secrets.IPINFO_TOKEN }}
        run: |
          set -e
          # -L 跟随重定向; -f 让 HTTP 4xx/5xx 直接报错而不是把错误页当文件下载
          curl -LsS -f -o ipinfo_lite.csv.gz \
            "https://ipinfo.io/data/ipinfo_lite.csv.gz?token=${IPINFO_TOKEN}"
          # 完整性校验: 必须是 gzip, 否则拿到的是 HTML 错误页/限流页
          file ipinfo_lite.csv.gz | grep -qi gzip || { echo "ERROR: 拿到的不是 gz"; exit 1; }
          ls -lh ipinfo_lite.csv.gz

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ipinfo_lite.csv.gz
          # 文件没变化就不产生空提交
          git diff --cached --quiet || git commit -m "chore: update ipinfo_lite $(date -u +%F)"
          git push
